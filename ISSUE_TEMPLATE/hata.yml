name: Hata bildirimi
description: Çalışmayan ya da yanlış çalışan bir şey
labels: [hata]
body:
  - type: textarea
    id: ne
    attributes:
      label: Ne oldu?
      description: Gördüğün davranış.
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: Ne olmasını bekliyordun?
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrarlanır?
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: textarea
    id: kanit
    attributes:
      label: Log, ekran görüntüsü, video
  - type: dropdown
    id: risk
    attributes:
      label: Uçuş güvenliğini etkiliyor mu?
      options:
        - Hayır
        - Evet (A sınıfı, hemen kaptana haber ver)
    validations:
      required: true
